name: Portfolio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: source code checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag portfolio:ci .

      - name: Start container
        run: |
          docker run --detach --name portfolio \
            --publish 127.0.0.1:8080:8080 \
            --user 1001230000:0 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            portfolio:ci

      - name: Check container responds
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:8080/healthz
          curl --fail --output /dev/null \
            http://127.0.0.1:8080/

      - name: Show container logs
        if: always()
        run: docker logs portfolio

      - name: Remove container
        if: always()
        run: docker rm --force portfolio   